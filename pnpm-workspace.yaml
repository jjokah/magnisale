packages:
  - apps/*
  - packages/*

# The only dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  sharp: true

# One version of each shared dependency. Hono's typed client in particular needs
# the same version on the API and the platform.
catalog:
  "@eslint/js": ^10.0.1
  "@hono/node-server": ^2.1.11
  "@hono/zod-validator": ^0.9.1
  "@tailwindcss/vite": ^4.3.5
  "@types/node": ^24.12.0
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  better-auth: ^1.7.27
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  esbuild: ^0.28.2
  eslint: ^10.15.0
  hono: ^4.13.20
  lucide-react: ^1.77.0
  pg: ^8.23.1
  pg-boss: ^12.39.0
  react: ^19.3.1
  react-dom: ^19.3.1
  sharp: ^0.35.5
  tailwindcss: ^4.3.5
  tsx: ^4.23.15
  typescript: ~5.9.3
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7
