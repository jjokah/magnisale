# Postgres for development and tests. These passwords are for this local
# database only. Port 5433 keeps it clear of any other Postgres on the machine.
name: magnisale-dev

services:
  db:
    image: postgres:17-alpine
    container_name: magnisale-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: magnisale
      POSTGRES_PASSWORD: magnisale
      POSTGRES_DB: magnisale
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnisale"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
