# The platform on one VM. No port is published: visitors arrive through the
# Cloudflare Tunnel, which connects outbound. See infra/README.md.
# The marketing site is not here: it is a Cloudflare Worker (apps/web).
name: magnisale

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://magnisale_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/magnisale

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: magnisale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: magnisale
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnisale"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once before the API and workers, so they never race to migrate.
  migrate:
    build:
      context: ..
      dockerfile: docker/workers.Dockerfile
    image: ${IMAGE_REGISTRY:-magnisale}/workers:${IMAGE_TAG:-local}
    command: ["node", "migrate.js"]
    restart: "no"
    environment:
      NODE_ENV: production
      OWNER_DATABASE_URL: postgres://magnisale:${POSTGRES_PASSWORD}@postgres:5432/magnisale
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: ${IMAGE_REGISTRY:-magnisale}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_URL: ${APP_URL:?set APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Only Caddy can reach this container, on the private compose network.
      TRUST_PROXY: uniquelocal
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Magnisale <hello@magnisale.com>}
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  workers:
    image: ${IMAGE_REGISTRY:-magnisale}/workers:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app-env
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    build:
      context: ..
      dockerfile: docker/caddy.Dockerfile
    image: ${IMAGE_REGISTRY:-magnisale}/caddy:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy

  # The way in. It can reach Caddy and nothing else.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    depends_on:
      - caddy

networks:
  edge:
  backend:

volumes:
  postgres-data:
